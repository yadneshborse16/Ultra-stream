
name: Build Ultra Stream APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android SDK Manager
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK Manager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Found SDK Manager: $SDKMANAGER"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK Packages
        shell: bash
        run: |
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Project ZIP
        shell: bash
        run: |
          ZIP_FILE="$(find . -type f \
            -name 'Ultra_Stream_ElitePlex_Integration_Work.zip' \
            -not -path './.git/*' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP was not found in the repository."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          echo "Project ZIP extracted successfully."

      - name: Locate Android Project
        shell: bash
        run: |
          PROJECT_DIR="$(find extracted -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find extracted -type f \
              \( -name build.gradle \
              -o -name build.gradle.kts \) \
              -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle project was found in the ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "ERROR: Gradle wrapper (gradlew) not found."
            echo "A compatible Gradle wrapper is required."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ultra-Stream-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
