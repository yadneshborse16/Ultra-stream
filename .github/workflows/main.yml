
name: Build Ultra Stream APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -type f \
            -name 'Ultra_Stream_ElitePlex_Integration_Work.zip' \
            -not -path './.git/*' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Project ZIP not found in repository"
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully"
          echo "=== Gradle files ==="

          find extracted -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name build.gradle \
            -o -name build.gradle.kts \
            -o -name gradlew \
            -o -name gradle-wrapper.properties \) -print

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/build.gradle" ] || \
               [ -f "$DIR/build.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find extracted -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \) -print
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android Gradle project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            echo "Gradle wrapper missing; generating wrapper"

            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          ./gradlew --no-daemon assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=== Generated APK files ==="

          find "$PROJECT_DIR" -type f -name '*.apk' -print

          if ! find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit | grep -q .; then
            echo "::error::Debug APK was not generated"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultra-Stream-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
