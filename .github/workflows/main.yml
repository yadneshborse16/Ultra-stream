
name: Build Ultra Stream APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -type f \
            -name 'Ultra_Stream_ElitePlex_Integration_Work.zip' \
            -not -path './.git/*' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Project ZIP not found in repository"
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          echo "=== Extracted files ==="
          find extracted -maxdepth 4 -type f | head -200

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r FILE; do
            DIR="$(dirname "$FILE")"
            if [ -f "$DIR/gradlew" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find extracted -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \) -print
          )

          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r FILE; do
              DIR="$(dirname "$FILE")"
              if [ -f "$DIR/gradlew" ]; then
                PROJECT_DIR="$DIR"
                break
              fi
            done < <(
              find extracted -type f \
                \( -name build.gradle \
                -o -name build.gradle.kts \) -print
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "=== Gradle files found ==="
            find extracted -type f \
              \( -name gradlew \
              -o -name settings.gradle \
              -o -name settings.gradle.kts \
              -o -name build.gradle \
              -o -name build.gradle.kts \
              -o -name gradle-wrapper.properties \) -print

            echo "::error::Gradle project with gradlew not found in ZIP"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultra-Stream-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
